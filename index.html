<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuffle PDF – merge, arrange, convert</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecf0;--surface:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#cdd5de;--accent:#1f4fd8;--accent-ink:#fff;--danger:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--surface:#1a222c;--ink:#e8edf2;--mute:#93a1b0;--line:#2b3644;--accent:#6b8cff;--accent-ink:#0b1020;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#10151b;--surface:#1a222c;--ink:#e8edf2;--mute:#93a1b0;--line:#2b3644;--accent:#6b8cff;--accent-ink:#0b1020;--danger:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 clamp(2rem,6vw,3.2rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px;max-width:56ch}
#drop{border:2px dashed var(--line);background:var(--surface);border-radius:14px;padding:30px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
#drop.over,#drop:focus-visible{border-color:var(--accent);outline:none}
#drop b{font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif}
#drop small{display:block;color:var(--mute);margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 14px}
.bar .grow{flex:1;color:var(--mute)}
button{font:600 .95rem Figtree,system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 2px 0 var(--line);cursor:grab;position:relative}
.pg.drag{opacity:.35}
.pg.target{outline:2px solid var(--accent)}
.th{height:170px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:4px;overflow:hidden}
.th img{max-width:100%;max-height:100%;transition:transform .2s}
.meta{font-size:.78rem;color:var(--mute);margin:6px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;gap:4px;justify-content:space-between}
.act button{padding:4px 0;flex:1;font-size:.9rem;border-radius:6px}
.act .del{color:var(--danger)}
.n{position:absolute;top:4px;left:4px;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:600;border-radius:5px;padding:1px 7px}
#msg{min-height:1.5em;color:var(--mute);margin-top:14px}
#msg.err{color:var(--danger)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}
</style>
</head>
<body>
<main>
  <h1>Shuffle PDF</h1>
  <p class="sub">Merge PDFs, drop in Word files or images, then drag the pages into order. Everything happens in your browser; nothing is uploaded.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Add files">
    <b>Drop files here or click to add</b>
    <small>PDF, Word (.docx), JPG, PNG, WebP</small>
    <input id="file" type="file" multiple hidden accept=".pdf,.docx,image/*,application/pdf">
  </div>

  <div class="bar">
    <span class="grow" id="count">No pages yet</span>
    <button id="sortName" disabled>Reverse order</button>
    <button id="clear" disabled>Clear all</button>
    <button id="go" class="primary" disabled>Download merged PDF</button>
  </div>
  <div id="grid"><div class="empty">Add some files to see their pages here.</div></div>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const {PDFDocument, degrees} = PDFLib;
const $ = s => document.querySelector(s);
const sources = {};   // id -> {name, bytes}
let pages = [];       // {src, idx, rot, thumb, name}
let uid = 0, dragFrom = null;

const msg = (t, err) => { const m = $("#msg"); m.textContent = t || ""; m.className = err ? "err" : ""; };

/* ---------- converters: everything becomes PDF bytes ---------- */
async function imageToPdf(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Cannot read image " + file.name)); i.src = url; });
  const doc = await PDFDocument.create();
  let emb;
  if (/jpe?g$/i.test(file.type)) emb = await doc.embedJpg(new Uint8Array(await file.arrayBuffer()));
  else {
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    emb = await doc.embedPng(new Uint8Array(await blob.arrayBuffer()));
  }
  URL.revokeObjectURL(url);
  const W = 595, H = 842, M = 24;
  const k = Math.min((W - 2 * M) / emb.width, (H - 2 * M) / emb.height, 1);
  const w = emb.width * k, h = emb.height * k;
  const p = doc.addPage([W, H]);
  p.drawImage(emb, {x: (W - w) / 2, y: (H - h) / 2, width: w, height: h});
  return await doc.save();
}

async function docxToPdf(file) {
  const {value} = await mammoth.convertToHtml({arrayBuffer: await file.arrayBuffer()});
  const el = document.createElement("div");
  el.style.cssText = "width:700px;padding:0;font:13px/1.5 Georgia,serif;color:#000;background:#fff";
  el.innerHTML = "<style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 6px}img{max-width:100%}</style>" + value;
  const buf = await html2pdf().set({margin: 15, jsPDF: {unit: "mm", format: "a4"}, html2canvas: {scale: 2}, pagebreak: {mode: ["css", "legacy"]}}).from(el).outputPdf("arraybuffer");
  return new Uint8Array(buf);
}

/* ---------- add files ---------- */
async function addFiles(list) {
  for (const f of list) {
    try {
      msg("Reading " + f.name + "…");
      let bytes;
      if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") bytes = new Uint8Array(await f.arrayBuffer());
      else if (/\.docx$/i.test(f.name)) bytes = await docxToPdf(f);
      else if (f.type.startsWith("image/")) bytes = await imageToPdf(f);
      else throw new Error(f.name + ": unsupported type. Use PDF, .docx or an image.");
      const id = ++uid;
      sources[id] = {name: f.name, bytes};
      const pdf = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
      for (let i = 0; i < pdf.numPages; i++) {
        const pg = await pdf.getPage(i + 1);
        const vp = pg.getViewport({scale: 0.4});
        const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
        await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
        pages.push({src: id, idx: i, rot: 0, thumb: c.toDataURL("image/jpeg", 0.7), name: f.name});
        render();
      }
      msg("");
    } catch (e) { msg(e.message || "Could not read " + f.name, true); }
  }
}

/* ---------- grid ---------- */
function render() {
  const g = $("#grid");
  $("#count").textContent = pages.length ? pages.length + (pages.length === 1 ? " page" : " pages") : "No pages yet";
  ["#go", "#clear", "#sortName"].forEach(s => $(s).disabled = !pages.length);
  if (!pages.length) { g.innerHTML = '<div class="empty">Add some files to see their pages here.</div>'; return; }
  g.innerHTML = "";
  pages.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "pg"; d.draggable = true;
    d.innerHTML = `<span class="n">${i + 1}</span><div class="th"><img alt="Page ${i + 1}" src="${p.thumb}" style="transform:rotate(${p.rot}deg)"></div><div class="meta" title="${p.name.replace(/"/g, "")}"></div>
    <div class="act"><button data-a="l" aria-label="Move earlier">◀</button><button data-a="r" aria-label="Rotate">⟳</button><button data-a="d" class="del" aria-label="Delete page">✕</button><button data-a="n" aria-label="Move later">▶</button></div>`;
    d.querySelector(".meta").textContent = p.name + " · p." + (p.idx + 1);
    d.ondragstart = e => { dragFrom = i; d.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", i); };
    d.ondragend = () => { d.classList.remove("drag"); dragFrom = null; };
    d.ondragover = e => { if (dragFrom !== null) { e.preventDefault(); d.classList.add("target"); } };
    d.ondragleave = () => d.classList.remove("target");
    d.ondrop = e => { e.preventDefault(); e.stopPropagation(); if (dragFrom === null || dragFrom === i) return; const [m] = pages.splice(dragFrom, 1); pages.splice(i, 0, m); render(); };
    d.querySelector(".act").onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === "r") p.rot = (p.rot + 90) % 360;
      if (a === "d") pages.splice(i, 1);
      if (a === "l" && i > 0) [pages[i - 1], pages[i]] = [pages[i], pages[i - 1]];
      if (a === "n" && i < pages.length - 1) [pages[i + 1], pages[i]] = [pages[i], pages[i + 1]];
      render();
    };
    g.appendChild(d);
  });
}

/* ---------- export ---------- */
async function exportPdf() {
  const btn = $("#go"); btn.disabled = true; msg("Building PDF…");
  try {
    const out = await PDFDocument.create();
    const cache = {};
    for (const p of pages) {
      cache[p.src] = cache[p.src] || await PDFDocument.load(sources[p.src].bytes, {ignoreEncryption: true});
      const [cp] = await out.copyPages(cache[p.src], [p.idx]);
      cp.setRotation(degrees((cp.getRotation().angle + p.rot) % 360));
      out.addPage(cp);
    }
    const data = await out.save();
    const dl = window.claude && await claude.use("downloads").catch(() => null);
    if (dl) await dl.save({filename: "merged.pdf", data});
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type: "application/pdf"}));
      a.download = "merged.pdf"; document.body.appendChild(a); a.click(); a.remove();
    }
    msg("Done. " + pages.length + " pages merged.");
  } catch (e) { if (e && e.code === "declined") msg(""); else msg("Could not build the PDF: " + (e.message || e.code), true); }
  btn.disabled = false;
}

/* ---------- wiring ---------- */
const drop = $("#drop"), input = $("#file");
drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
input.onchange = () => { addFiles([...input.files]); input.value = ""; };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { if (e.dataTransfer.types.includes("Files")) { e.preventDefault(); drop.classList.add("over"); } }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", e => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });
$("#go").onclick = exportPdf;
$("#clear").onclick = () => { pages = []; render(); msg(""); };
$("#sortName").onclick = () => { pages.reverse(); render(); };
render();
</script>
</body>
</html>
